<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="tpTitle tpDesc">
  <title id="tpTitle">ORDO 58mm thermal receipt printer</title>
  <desc id="tpDesc">Compact POS-58 thermal printer with an ORDO receipt — sold with monthly kitchen plans.</desc>
  <defs>
    <linearGradient id="studio" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbf4e8"/>
      <stop offset="55%" stop-color="#efe4d2"/>
      <stop offset="100%" stop-color="#e4d4bc"/>
    </linearGradient>
    <radialGradient id="spot" cx="42%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#fffaf2" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f3e6d0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d9c7ab" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyFront" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3a3d43"/>
      <stop offset="18%" stop-color="#2a2d32"/>
      <stop offset="70%" stop-color="#16181c"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1b1e23"/>
      <stop offset="100%" stop-color="#0a0c0e"/>
    </linearGradient>
    <linearGradient id="lidTop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5a5f68"/>
      <stop offset="35%" stop-color="#3e434b"/>
      <stop offset="100%" stop-color="#25282e"/>
    </linearGradient>
    <linearGradient id="lidFront" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#4a4f57"/>
      <stop offset="100%" stop-color="#2c3036"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="100%" stop-color="#f3ead6"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff8ea"/>
      <stop offset="45%" stop-color="#e8d9bc"/>
      <stop offset="100%" stop-color="#cbb896"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff9a3c"/>
      <stop offset="100%" stop-color="#e06a12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#7a6448" flood-opacity="0.28"/>
    </filter>
    <filter id="paperShadow" x="-15%" y="-8%" width="130%" height="125%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#6b573e" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="640" height="760" rx="36" fill="url(#studio)"/>
  <rect width="640" height="760" rx="36" fill="url(#spot)"/>
  <ellipse cx="320" cy="678" rx="210" ry="28" fill="#c4b195" opacity="0.45"/>

  <!-- receipt -->
  <g filter="url(#paperShadow)" transform="translate(232 28)">
    <path fill="url(#paper)" stroke="#e6d9c2" stroke-width="1.2" d="M0 0 H176 V318 l-8 8 8 8 -8 8 8 8 -8 8 8 8 -8 8 8 8 -8 8 8 8 H0 l8 -8 -8 -8 8 -8 -8 -8 8 -8 -8 -8 8 -8 -8 -8 8 -8 -8 -8 Z"/>
    <text x="88" y="32" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="20" font-weight="700" fill="#1c1916" letter-spacing="3">ORDO</text>
    <text x="88" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#f58220" letter-spacing="1.6">DEMO KITCHEN</text>
    <rect x="18" y="64" width="140" height="1" fill="#e2d6c0"/>
    <text x="18" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#3a342e">Karahi</text>
    <text x="158" y="86" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#3a342e">?890</text>
    <text x="18" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#3a342e">Naan ×2</text>
    <text x="158" y="106" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#3a342e">?160</text>
    <text x="18" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#3a342e">Chai</text>
    <text x="158" y="126" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#3a342e">?80</text>
    <rect x="18" y="140" width="140" height="1" fill="#e2d6c0"/>
    <text x="18" y="162" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1c1916">TOTAL</text>
    <text x="158" y="162" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1c1916">?1,130</text>
    <text x="18" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#6b635a">Cash · Dining · T7</text>
    <rect x="48" y="200" width="80" height="28" rx="3" fill="#1c1916"/>
    <rect x="54" y="206" width="8" height="16" fill="#f3ead6"/>
    <rect x="66" y="210" width="6" height="12" fill="#f3ead6"/>
    <rect x="76" y="204" width="7" height="18" fill="#f3ead6"/>
    <rect x="87" y="208" width="5" height="14" fill="#f3ead6"/>
    <rect x="96" y="206" width="9" height="16" fill="#f3ead6"/>
    <rect x="109" y="212" width="6" height="10" fill="#f3ead6"/>
    <text x="88" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8a8176">58mm thermal · ORDO OS</text>
    <text x="88" y="268" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="10" font-style="italic" fill="#5c534a">Thank you — come again</text>
  </g>

  <!-- printer body -->
  <g filter="url(#soft)">
    <path fill="url(#bodySide)" d="M438 368 L498 322 L498 538 L438 592 Z"/>
    <path fill="url(#bodyFront)" d="M142 368 H438 V592 H142 Z"/>
    <path fill="url(#lidTop)" d="M176 292 L454 292 L498 322 L438 368 H142 L176 292 Z"/>
    <path fill="url(#lidFront)" d="M142 368 H438 L438 396 H142 Z"/>

    <!-- lid window + roll -->
    <path fill="#121417" d="M214 318 L400 318 L418 332 L232 332 Z"/>
    <ellipse cx="316" cy="325" rx="78" ry="10" fill="url(#roll)"/>
    <ellipse cx="316" cy="322" rx="78" ry="7" fill="#fff6e6"/>
    <ellipse cx="316" cy="322" rx="14" ry="4" fill="#b7a07e"/>

    <!-- paper slot -->
    <rect x="232" y="348" width="176" height="12" rx="3" fill="#07080a"/>
    <rect x="238" y="350" width="164" height="4" rx="2" fill="#1c1f24"/>

    <!-- front plate -->
    <rect x="168" y="424" width="246" height="132" rx="16" fill="#0f1114"/>
    <rect x="176" y="432" width="230" height="116" rx="12" fill="#171a1f"/>
    <text x="196" y="468" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#f3ede4">ORDO</text>
    <text x="196" y="488" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" letter-spacing="1.4" fill="#8a8580">POS-58 · 58mm</text>
    <rect x="196" y="504" width="92" height="6" rx="3" fill="#2a2e35"/>
    <rect x="196" y="518" width="64" height="5" rx="2.5" fill="#2a2e35"/>

    <circle cx="372" cy="500" r="22" fill="url(#btn)"/>
    <circle cx="372" cy="500" r="8" fill="#fff3e6"/>
    <circle cx="208" cy="546" r="5" fill="#3ecf8e"/>
    <circle cx="226" cy="546" r="5" fill="#c45c26" opacity="0.55"/>

    <!-- highlight -->
    <path fill="#ffffff" opacity="0.06" d="M150 376 H250 L210 584 H150 Z"/>
    <path fill="#ffffff" opacity="0.08" d="M190 298 L430 298 L454 316 L214 316 Z"/>
  </g>

  <text x="320" y="726" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#6b5c4a">MONTHLY PACKAGE · SOFTWARE + PAPER</text>
</svg>
