<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{BUSINESS_NAME}} — VIP Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Syne:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">{{BUSINESS_NAME}}</div>
      <a class="ghost" href="#visit">Visit</a>
    </header>

    <main>
      <section class="hero" aria-label="Hero">
        <div class="hero-panel">
          <p class="eyebrow">{{CITY}}</p>
          <h1 class="brand-hero">{{BUSINESS_NAME}}</h1>
          <p class="lede">{{TAGLINE}}</p>
          <div class="cta-row">
            <a class="cta" href="#visit">Reserve a table</a>
            <a class="cta secondary" href="https://ordo.asfins.com" rel="noreferrer"
              >Powered by ORDO</a
            >
          </div>
        </div>
      </section>

      <section class="strip" id="highlights">
        <h2>Why guests come back</h2>
        <ul>
          {{HIGHLIGHTS}}
        </ul>
      </section>

      <section class="visit" id="visit">
        <h2>Find us</h2>
        <p>{{ADDRESS}}</p>
        <p class="phone">{{PHONE}}</p>
      </section>
    </main>

    <footer>
      <span>VIP demo generated by ORDO Local MoA</span>
      <a href="https://ordo.asfins.com">Get ORDO for your kitchen</a>
    </footer>
    <script src="./motion.js"></script>
  </body>
</html>
